        <nav class="nav">

  <main>
  <section class="imc-banner">
    <h2>tabela de IMC</h2>
    <h1>Como saber se estou dentro da media de peso</h1>
    <img src="imagens/image5.png" alt="tabela imc">
  </section>

  <section class="formula-imc">
    <h1>calcule seu IMC e descubra se você está no peso ideal!</h1>
    <h2>fórmula do IMC:</h2>
    <div class="formula">
      <h3>peso</h3>
      <h4>(altura)²</h4>
    </div>
  </section>

  <section class="imc">
    <fieldset>
      <legend>Calculadora de IMC</legend>
      <form id="formIMC">
        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" step="0.1" placeholder="Ex: 75.5" required>
        <br><br>
        
        <label for="altura">Altura (m):</label>
        <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
        <br><br>
        
        <button type="submit" id="btnCalcular">Calcular IMC</button>
      </form>


      <div id="resultado" style="margin-top: 20px; font-weight: bold; color:green;"></div>
    </fieldset>
  </section>

  <script src="js/imc.js"></script>
</main>
