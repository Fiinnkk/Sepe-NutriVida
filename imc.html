    <section class="imc">
        <h2>Calculadora de IMC</h2>

        <form id="formIMC">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 75.5" required>
            <br><br>

            <label for="altura">Altura (m):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75" required>
            <br><br>

            <button type="submit" id="btnCalcular">Calcular IMC</button>
        </form>

        <!-- O resultado será exibido aqui -->
        <div id="resultado" style="margin-top: 20px; font-weight: bold;"></div>

    </section>
</body>
